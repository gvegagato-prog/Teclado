name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests, lint y compilación release (sin firmar: la clave no está en el repo)
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-teclado
          path: app/build/previews/*.png
          if-no-files-found: ignore
