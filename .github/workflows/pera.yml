name: Pera

on:
  push:
    paths: ["pera/**", ".github/workflows/pera.yml"]
  pull_request:
    paths: ["pera/**", ".github/workflows/pera.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pera/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Pruebas, lint y APK (release sin firmar y debug instalable)
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: pera-android
          path: pera/android/app/build/outputs/apk/**/*.apk

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: pera/mac
    steps:
      - uses: actions/checkout@v7
      - name: Compilar Pera.app
        run: ./build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pera-mac
          path: pera/mac/build/Pera-mac.zip
